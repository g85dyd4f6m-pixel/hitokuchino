<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>部員 週2回ノルマ管理シート</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background-color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="text-slate-800 pb-20">
  <!-- ヘッダー -->
  <header class="bg-slate-900 text-white sticky top-0 z-30 shadow-md">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="text-base sm:text-lg font-bold tracking-tight flex items-center gap-2">
          <span>🥍</span>
          <span>部員 週2回ノルマ管理</span>
        </h1>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openBackupModal()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-2.5 py-1.5 rounded-lg border border-slate-700 transition">
          バックアップ
        </button>
        <button onclick="openAddMemberModal()" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-3 py-1.5 rounded-lg shadow-sm transition">
          ＋ 部員追加
        </button>
      </div>
    </div>

    <!-- 週切り替えバー -->
    <div class="bg-slate-800 border-t border-slate-700">
      <div class="max-w-3xl mx-auto px-4 py-2 flex items-center justify-between">
        <button onclick="changeWeek(-1)" class="p-1.5 rounded-lg hover:bg-slate-700 text-slate-300 active:scale-95 transition" aria-label="前の週">
          ◀ 前週
        </button>
        <div class="text-center">
          <div id="weekLabel" class="text-sm font-bold text-white">今週</div>
          <div id="weekRange" class="text-xs text-slate-400"></div>
        </div>
        <button onclick="changeWeek(1)" class="p-1.5 rounded-lg hover:bg-slate-700 text-slate-300 active:scale-95 transition" aria-label="次の週">
          次週 ▶
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 pt-4 space-y-4">
    <!-- サマリーカード -->
    <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">今週の達成状況</span>
        <span id="completionRateText" class="text-sm font-extrabold text-emerald-600">0% (0/14名)</span>
      </div>
      <div class="w-full bg-slate-100 rounded-full h-2.5 mb-3 overflow-hidden">
        <div id="progressBar" class="bg-emerald-500 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
      </div>
      <div class="grid grid-cols-4 gap-2 text-center">
        <div class="bg-slate-50 rounded-xl p-2 border border-slate-100">
          <div class="text-[11px] text-slate-500">全部員</div>
          <div id="statTotal" class="text-base font-bold text-slate-800">14</div>
        </div>
        <div class="bg-emerald-50 rounded-xl p-2 border border-emerald-100">
          <div class="text-[11px] text-emerald-700 font-medium">達成 (2/2)</div>
          <div id="statDone" class="text-base font-bold text-emerald-700">0</div>
        </div>
        <div class="bg-amber-50 rounded-xl p-2 border border-amber-100">
          <div class="text-[11px] text-amber-700 font-medium">あと1回 (1/2)</div>
          <div id="statHalf" class="text-base font-bold text-amber-700">0</div>
        </div>
        <div class="bg-rose-50 rounded-xl p-2 border border-rose-100">
          <div class="text-[11px] text-rose-700 font-medium">未達成 (0/2)</div>
          <div id="statZero" class="text-base font-bold text-rose-700">0</div>
        </div>
      </div>

      <!-- ポジション別達成率 -->
      <div id="positionSummary" class="grid grid-cols-4 gap-1.5 mt-3 pt-3 border-t border-slate-100 text-center"></div>
    </section>

    <!-- アクション＆フィルター -->
    <section class="space-y-2.5">
      <div class="flex flex-col sm:flex-row gap-2">
        <button onclick="copyUnfinishedToClipboard()" class="flex-1 bg-slate-900 hover:bg-slate-800 active:scale-[0.99] text-white font-semibold text-sm py-2.5 px-4 rounded-xl shadow-sm flex items-center justify-center gap-2 transition">
          <span>📋 未達成者リストをコピー（LINE用）</span>
        </button>
      </div>

      <!-- フィルタータブ -->
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1">
        <button onclick="setFilter('ALL')" data-filter="ALL" class="filter-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-800 text-white whitespace-nowrap">全員</button>
        <button onclick="setFilter('UNFINISHED')" data-filter="UNFINISHED" class="filter-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-white text-slate-600 border border-slate-200 whitespace-nowrap">未達成のみ</button>
        <button onclick="setFilter('SSDM')" data-filter="SSDM" class="filter-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-white text-slate-600 border border-slate-200 whitespace-nowrap">SSDM</button>
        <button onclick="setFilter('LDF')" data-filter="LDF" class="filter-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-white text-slate-600 border border-slate-200 whitespace-nowrap">LDF</button>
        <button onclick="setFilter('G')" data-filter="G" class="filter-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-white text-slate-600 border border-slate-200 whitespace-nowrap">G</button>
        <button onclick="setFilter('FO')" data-filter="FO" class="filter-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-white text-slate-600 border border-slate-200 whitespace-nowrap">FO</button>
      </div>
    </section>

    <!-- 部員リスト -->
    <section id="memberList" class="space-y-2.5"></section>
  </main>

  <!-- トースト通知 -->
  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-200 z-50 whitespace-nowrap"></div>

  <!-- 部員追加・編集モーダル -->
  <div id="memberModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-xl">
      <h2 id="memberModalTitle" class="text-base font-bold text-slate-800">部員を追加</h2>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">名前</label>
          <input id="memberNameInput" type="text" placeholder="例：山田" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-800" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">ポジション</label>
          <select id="memberPosInput" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-slate-800">
            <option value="SSDM">SSDM</option>
            <option value="LDF">LDF</option>
            <option value="G">G</option>
            <option value="FO">FO</option>
          </select>
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeMemberModal()" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-xl">キャンセル</button>
        <button onclick="saveMember()" class="px-4 py-2 text-xs font-semibold bg-slate-900 text-white rounded-xl hover:bg-slate-800">保存する</button>
      </div>
    </div>
  </div>

  <!-- バックアップモーダル -->
  <div id="backupModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 space-y-4 shadow-xl">
      <div class="flex items-center justify-between">
        <h2 class="text-base font-bold text-slate-800">データのバックアップ・復元</h2>
        <button onclick="closeBackupModal()" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
      </div>
      <p class="text-xs text-slate-500 leading-relaxed">
        万が一ブラウザの履歴削除などでデータが消えた場合に備え、現在の記録をテキストとしてコピー・復元できます。
      </p>
      <div class="space-y-2">
        <button onclick="exportDataToClipboard()" class="w-full py-2.5 bg-slate-900 text-white text-xs font-semibold rounded-xl hover:bg-slate-800">
          現在のデータをクリップボードにコピー
        </button>
      </div>
      <div class="pt-2 border-t border-slate-100 space-y-2">
        <label class="block text-xs font-semibold text-slate-600">バックアップテキストから復元</label>
        <textarea id="importTextarea" rows="3" placeholder="コピーしたバックアップデータをここに貼り付け" class="w-full border border-slate-300 rounded-xl p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-slate-800"></textarea>
        <button onclick="importDataFromText()" class="w-full py-2 bg-emerald-600 text-white text-xs font-semibold rounded-xl hover:bg-emerald-500">
          データを復元する
        </button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'lacrosse_quota_tracker_v2';

    const DEFAULT_MEMBERS = [
      { id: 'm1', name: 'しそら', pos: 'SSDM' },
      { id: 'm2', name: '塩見', pos: 'SSDM' },
      { id: 'm3', name: 'きよと', pos: 'SSDM' },
      { id: 'm4', name: '江口', pos: 'LDF' },
      { id: 'm5', name: 'かい', pos: 'LDF' },
      { id: 'm6', name: '北畠', pos: 'LDF' },
      { id: 'm7', name: 'そうわ', pos: 'LDF' },
      { id: 'm8', name: 'しこう', pos: 'LDF' },
      { id: 'm9', name: '直井', pos: 'LDF' },
      { id: 'm10', name: 'にしじま', pos: 'LDF' },
      { id: 'm11', name: 'たくみ', pos: 'LDF' },
      { id: 'm12', name: 'よしき', pos: 'G' },
      { id: 'm13', name: 'ほーちん', pos: 'FO' },
      { id: 'm14', name: 'こうせい', pos: 'FO' }
    ];

    let state = loadState();
    let currentWeekOffset = 0;
    let currentFilter = 'ALL';
    let editingMemberId = null;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed.members) && parsed.members.length > 0) {
            return parsed;
          }
        }
      } catch (e) {
        console.error(e);
      }
      return {
        members: [...DEFAULT_MEMBERS],
        records: {}
      };
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        showToast('保存に失敗しました');
      }
    }

    function getMondayOfWeek(offset = 0) {
      const now = new Date();
      const day = now.getDay();
      const diff = (day === 0 ? -6 : 1 - day) + offset * 7;
      const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diff);
      monday.setHours(0, 0, 0, 0);
      return monday;
    }

    function formatWeekKey(monday) {
      const y = monday.getFullYear();
      const m = String(monday.getMonth() + 1).padStart(2, '0');
      const d = String(monday.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatDisplayRange(monday) {
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);
      const m1 = monday.getMonth() + 1;
      const d1 = monday.getDate();
      const m2 = sunday.getMonth() + 1;
      const d2 = sunday.getDate();
      return `${m1}/${d1}(月) 〜 ${m2}/${d2}(日)`;
    }

    function getCurrentWeekKey() {
      return formatWeekKey(getMondayOfWeek(currentWeekOffset));
    }

    function ensureWeekRecord(weekKey) {
      if (!state.records[weekKey]) {
        state.records[weekKey] = {};
      }
      return state.records[weekKey];
    }

    function getMemberRecord(weekKey, memberId) {
      const weekRec = ensureWeekRecord(weekKey);
      if (!weekRec[memberId]) {
        weekRec[memberId] = { c1: null, c2: null, note: '' };
      }
      return weekRec[memberId];
    }

    function toggleCheck(memberId, slot) {
      const weekKey = getCurrentWeekKey();
      const rec = getMemberRecord(weekKey, memberId);
      if (rec[slot]) {
        rec[slot] = null;
      } else {
        const now = new Date();
        rec[slot] = `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      }
      saveState();
      render();
    }

    function updateNote(memberId, value) {
      const weekKey = getCurrentWeekKey();
      const rec = getMemberRecord(weekKey, memberId);
      rec.note = value;
      saveState();
    }

    function changeWeek(delta) {
      currentWeekOffset += delta;
      render();
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.dataset.filter === filter) {
          btn.className = 'filter-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-800 text-white whitespace-nowrap';
        } else {
          btn.className = 'filter-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-white text-slate-600 border border-slate-200 whitespace-nowrap';
        }
      });
      render();
    }

    function getPosBadgeColor(pos) {
      switch (pos) {
        case 'SSDM': return 'bg-sky-100 text-sky-800 border-sky-200';
        case 'LDF': return 'bg-indigo-100 text-indigo-800 border-indigo-200';
        case 'G': return 'bg-amber-100 text-amber-800 border-amber-200';
        case 'FO': return 'bg-purple-100 text-purple-800 border-purple-200';
        default: return 'bg-slate-100 text-slate-700 border-slate-200';
      }
    }

    function render() {
      const monday = getMondayOfWeek(currentWeekOffset);
      const weekKey = formatWeekKey(monday);

      const labelEl = document.getElementById('weekLabel');
      if (currentWeekOffset === 0) labelEl.textContent = '今週';
      else if (currentWeekOffset === -1) labelEl.textContent = '先週';
      else if (currentWeekOffset === 1) labelEl.textContent = '来週';
      else labelEl.textContent = currentWeekOffset > 0 ? `${currentWeekOffset}週間後` : `${Math.abs(currentWeekOffset)}週間前`;

      document.getElementById('weekRange').textContent = formatDisplayRange(monday);

      let doneCount = 0;
      let halfCount = 0;
      let zeroCount = 0;

      const posStats = {
        SSDM: { total: 0, done: 0 },
        LDF: { total: 0, done: 0 },
        G: { total: 0, done: 0 },
        FO: { total: 0, done: 0 }
      };

      state.members.forEach(m => {
        const rec = getMemberRecord(weekKey, m.id);
        const count = (rec.c1 ? 1 : 0) + (rec.c2 ? 1 : 0);
        if (count === 2) doneCount++;
        else if (count === 1) halfCount++;
        else zeroCount++;

        if (posStats[m.pos]) {
          posStats[m.pos].total++;
          if (count === 2) posStats[m.pos].done++;
        }
      });

      const total = state.members.length;
      const rate = total > 0 ? Math.round((doneCount / total) * 100) : 0;

      document.getElementById('completionRateText').textContent = `${rate}% (${doneCount}/${total}名)`;
      document.getElementById('progressBar').style.width = `${rate}%`;
      document.getElementById('statTotal').textContent = total;
      document.getElementById('statDone').textContent = doneCount;
      document.getElementById('statHalf').textContent = halfCount;
      document.getElementById('statZero').textContent = zeroCount;

      const posSummaryEl = document.getElementById('positionSummary');
      posSummaryEl.innerHTML = ['SSDM', 'LDF', 'G', 'FO'].map(pos => {
        const st = posStats[pos];
        return `
          <div class="bg-slate-50 rounded-lg py-1.5 px-1">
            <div class="text-[10px] font-bold text-slate-500">${pos}</div>
            <div class="text-xs font-bold text-slate-800">${st.done}/${st.total}</div>
          </div>
        `;
      }).join('');

      const filteredMembers = state.members.filter(m => {
        const rec = getMemberRecord(weekKey, m.id);
        const count = (rec.c1 ? 1 : 0) + (rec.c2 ? 1 : 0);
        if (currentFilter === 'UNFINISHED') return count < 2;
        if (['SSDM', 'LDF', 'G', 'FO'].includes(currentFilter)) return m.pos === currentFilter;
        return true;
      });

      const listEl = document.getElementById('memberList');
      if (filteredMembers.length === 0) {
        listEl.innerHTML = `<div class="bg-white rounded-2xl p-8 text-center text-sm text-slate-400 border border-slate-200">該当する部員がいません</div>`;
        return;
      }

      listEl.innerHTML = filteredMembers.map(m => {
        const rec = getMemberRecord(weekKey, m.id);
        const count = (rec.c1 ? 1 : 0) + (rec.c2 ? 1 : 0);
        const isComplete = count === 2;

        return `
          <div class="bg-white rounded-2xl p-3.5 shadow-sm border ${isComplete ? 'border-emerald-300 bg-emerald-50/20' : 'border-slate-200'} transition">
            <div class="flex items-center justify-between gap-2 mb-2.5">
              <div class="flex items-center gap-2 min-w-0">
                <span class="text-[11px] font-bold px-2 py-0.5 rounded-md border ${getPosBadgeColor(m.pos)}">${m.pos}</span>
                <span class="font-bold text-base text-slate-800 truncate">${escapeHtml(m.name)}</span>
                ${isComplete ? '<span class="text-xs font-bold text-emerald-600 bg-emerald-100 px-2 py-0.5 rounded-full">達成済</span>' : ''}
              </div>
              <div class="flex items-center gap-1 shrink-0">
                <button onclick="openEditMemberModal('${m.id}')" class="text-xs text-slate-400 hover:text-slate-700 px-2 py-1 rounded-lg">編集</button>
                <button onclick="deleteMember('${m.id}')" class="text-xs text-slate-400 hover:text-rose-600 px-2 py-1 rounded-lg">削除</button>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2 mb-2">
              <button onclick="toggleCheck('${m.id}', 'c1')" class="py-2.5 px-3 rounded-xl border text-left transition flex items-center justify-between ${rec.c1 ? 'bg-emerald-600 border-emerald-600 text-white shadow-sm' : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100'}">
                <div>
                  <div class="text-xs font-bold">1回目</div>
                  <div class="text-[10px] ${rec.c1 ? 'text-emerald-100' : 'text-slate-400'}">${rec.c1 ? rec.c1 : '未実施'}</div>
                </div>
                <span class="text-base font-bold">${rec.c1 ? '✓' : '○'}</span>
              </button>

              <button onclick="toggleCheck('${m.id}', 'c2')" class="py-2.5 px-3 rounded-xl border text-left transition flex items-center justify-between ${rec.c2 ? 'bg-emerald-600 border-emerald-600 text-white shadow-sm' : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100'}">
                <div>
                  <div class="text-xs font-bold">2回目</div>
                  <div class="text-[10px] ${rec.c2 ? 'text-emerald-100' : 'text-slate-400'}">${rec.c2 ? rec.c2 : '未実施'}</div>
                </div>
                <span class="text-base font-bold">${rec.c2 ? '✓' : '○'}</span>
              </button>
            </div>

            <input
              type="text"
              value="${escapeHtml(rec.note || '')}"
              onchange="updateNote('${m.id}', this.value)"
              placeholder="メモ（例：壁当て・自主練内容など）"
              class="w-full text-xs bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 text-slate-600 placeholder-slate-400 focus:outline-none focus:bg-white focus:border-slate-400"
            />
          </div>
        `;
      }).join('');
    }

    function copyUnfinishedToClipboard() {
      const monday = getMondayOfWeek(currentWeekOffset);
      const weekKey = formatWeekKey(monday);
      const rangeText = formatDisplayRange(monday);

      const halfList = [];
      const zeroList = [];
      let doneCount = 0;

      state.members.forEach(m => {
        const rec = getMemberRecord(weekKey, m.id);
        const count = (rec.c1 ? 1 : 0) + (rec.c2 ? 1 : 0);
        if (count === 2) doneCount++;
        else if (count === 1) halfList.push(`・[${m.pos}] ${m.name}`);
        else zeroList.push(`・[${m.pos}] ${m.name}`);
      });

      const lines = [
        `【週2回ノルマ進捗状況】`,
        `対象期間：${rangeText}`,
        `達成状況：${doneCount}/${state.members.length}名 完了`,
        ``
      ];

      if (halfList.length > 0) {
        lines.push(`■ あと1回（1/2達成）`);
        lines.push(...halfList);
        lines.push(``);
      }

      if (zeroList.length > 0) {
        lines.push(`■ 未達成（0/2）`);
        lines.push(...zeroList);
        lines.push(``);
      }

      if (halfList.length === 0 && zeroList.length === 0) {
        lines.push(`全員今週のノルマ達成済みです！🎉`);
      } else {
        lines.push(`期限までの達成よろしくお願いします！`);
      }

      const text = lines.join('\n');
      navigator.clipboard.writeText(text).then(() => {
        showToast('LINE共有用リストをコピーしました');
      }).catch(() => {
        showToast('コピーに失敗しました');
      });
    }

    function openAddMemberModal() {
      editingMemberId = null;
      document.getElementById('memberModalTitle').textContent = '部員を追加';
      document.getElementById('memberNameInput').value = '';
      document.getElementById('memberPosInput').value = 'LDF';
      document.getElementById('memberModal').classList.remove('hidden');
      document.getElementById('memberModal').classList.add('flex');
    }

    function openEditMemberModal(id) {
      const member = state.members.find(m => m.id === id);
      if (!member) return;
      editingMemberId = id;
      document.getElementById('memberModalTitle').textContent = '部員情報を編集';
      document.getElementById('memberNameInput').value = member.name;
      document.getElementById('memberPosInput').value = member.pos;
      document.getElementById('memberModal').classList.remove('hidden');
      document.getElementById('memberModal').classList.add('flex');
    }

    function closeMemberModal() {
      document.getElementById('memberModal').classList.add('hidden');
      document.getElementById('memberModal').classList.remove('flex');
    }

    function saveMember() {
      const name = document.getElementById('memberNameInput').value.trim();
      const pos = document.getElementById('memberPosInput').value;
      if (!name) {
        showToast('名前を入力してください');
        return;
      }

      if (editingMemberId) {
        const member = state.members.find(m => m.id === editingMemberId);
        if (member) {
          member.name = name;
          member.pos = pos;
        }
      } else {
        state.members.push({
          id: 'm_' + Date.now(),
          name,
          pos
        });
      }

      saveState();
      closeMemberModal();
      render();
      showToast('保存しました');
    }

    function deleteMember(id) {
      const member = state.members.find(m => m.id === id);
      if (!member) return;
      if (!confirm(`${member.name} をリストから削除しますか？`)) return;
      state.members = state.members.filter(m => m.id !== id);
      saveState();
      render();
      showToast('削除しました');
    }

    function openBackupModal() {
      document.getElementById('importTextarea').value = '';
      document.getElementById('backupModal').classList.remove('hidden');
      document.getElementById('backupModal').classList.add('flex');
    }

    function closeBackupModal() {
      document.getElementById('backupModal').classList.add('hidden');
      document.getElementById('backupModal').classList.remove('flex');
    }

    function exportDataToClipboard() {
      const json = JSON.stringify(state);
      navigator.clipboard.writeText(json).then(() => {
        showToast('バックアップデータをコピーしました');
      }).catch(() => {
        showToast('コピーに失敗しました');
      });
    }

    function importDataFromText() {
      const raw = document.getElementById('importTextarea').value.trim();
      if (!raw) {
        showToast('データを貼り付けてください');
        return;
      }
      try {
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed.members) || typeof parsed.records !== 'object') {
          throw new Error('Invalid format');
        }
        state = parsed;
        saveState();
        closeBackupModal();
        render();
        showToast('データを復元しました');
      } catch (e) {
        showToast('データ形式が正しくありません');
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('opacity-0');
      setTimeout(() => {
        toast.classList.add('opacity-0');
      }, 2200);
    }

    render();
  </script>
</body>
</html>
